name: 🔄 Keep Capri Store Alive

on:
  schedule:
    # Ejecutar cada 12 minutos (evita que Render duerma después de 15 min)
    - cron: '*/12 * * * *'
  
  # Permitir ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📡 Ping Health Check
        run: |
          echo "🔄 Verificando salud del servicio..."
          response=$(curl -s -w "HTTPSTATUS:%{http_code}" https://capri-store.onrender.com/ping)
          http_code=$(echo $response | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')
          body=$(echo $response | sed -e 's/HTTPSTATUS:.*//g')
          
          echo "📊 Status Code: $http_code"
          echo "📄 Response: $body"
          
          if [ $http_code -eq 200 ]; then
            echo "✅ Servicio respondiendo correctamente"
          else
            echo "❌ Servicio no responde correctamente"
            exit 1
          fi

      - name: 📱 Check WhatsApp Status
        run: |
          echo "📱 Verificando estado de WhatsApp..."
          response=$(curl -s -w "HTTPSTATUS:%{http_code}" https://capri-store.onrender.com/whatsapp-status)
          http_code=$(echo $response | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')
          body=$(echo $response | sed -e 's/HTTPSTATUS:.*//g')
          
          echo "📊 WhatsApp Status Code: $http_code"
          echo "📄 WhatsApp Response: $body"
          
          if [ $http_code -eq 200 ]; then
            echo "✅ Estado de WhatsApp obtenido correctamente"
            
            # Extraer si WhatsApp está ready usando jq si está disponible, si no con grep
            if command -v jq &> /dev/null; then
              whatsapp_ready=$(echo "$body" | jq -r '.whatsapp_ready // false')
            else
              whatsapp_ready=$(echo "$body" | grep -o '"whatsapp_ready":[^,}]*' | cut -d':' -f2 | tr -d ' "')
            fi
            
            echo "📱 WhatsApp Ready: $whatsapp_ready"
            
            if [ "$whatsapp_ready" = "true" ]; then
              echo "✅ WhatsApp está conectado y funcionando"
            else
              echo "⚠️ WhatsApp no está conectado - puede necesitar atención"
            fi
          else
            echo "❌ No se pudo obtener estado de WhatsApp"
          fi

      - name: 🔧 WhatsApp Maintenance
        run: |
          echo "🔧 Verificando estado de WhatsApp..."
          
          # Verificar estado de WhatsApp sin intervención
          response=$(curl -s -w "HTTPSTATUS:%{http_code}" https://capri-store.onrender.com/whatsapp-status)
          http_code=$(echo $response | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')
          body=$(echo $response | sed -e 's/HTTPSTATUS:.*//g')
          
          echo "🔧 WhatsApp Status Code: $http_code"
          echo "🔧 WhatsApp Response: $body"
          
          if [ $http_code -eq 200 ]; then
            echo "✅ Estado de WhatsApp obtenido correctamente"
          else
            echo "⚠️ No se pudo obtener estado de WhatsApp, pero continuando..."
          fi

      - name: 📊 Memory Check
        run: |
          echo "📊 Verificando uso de memoria..."
          response=$(curl -s -w "HTTPSTATUS:%{http_code}" https://capri-store.onrender.com/memory-status)
          http_code=$(echo $response | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')
          body=$(echo $response | sed -e 's/HTTPSTATUS:.*//g')
          
          echo "📊 Memory Status Code: $http_code"
          echo "📄 Memory Response: $body"
          
          if [ $http_code -eq 200 ]; then
            echo "✅ Información de memoria obtenida"
            
            # Extraer porcentaje de uso si está disponible
            if command -v jq &> /dev/null; then
              usage_percent=$(echo "$body" | jq -r '.render_info.usage_percent // "N/A"')
              echo "📊 Uso de memoria: $usage_percent%"
              
              if [ "$usage_percent" != "N/A" ] && [ "$usage_percent" -gt 85 ]; then
                echo "⚠️ USO DE MEMORIA ALTO: $usage_percent%"
              fi
            fi
          else
            echo "⚠️ No se pudo obtener información de memoria"
          fi

      - name: 🎯 Summary
        run: |
          echo ""
          echo "🎯 ===== RESUMEN DE KEEP-ALIVE ====="
          echo "📅 Fecha: $(date)"
          echo "🔄 Servicio mantenido activo exitosamente"
          echo "⏰ Próxima ejecución: en 12 minutos"
          echo "🌐 URL: https://capri-store.onrender.com"
          echo "📱 Dashboard: https://dashboard.render.com"
          echo "=================================="
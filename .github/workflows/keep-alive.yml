name: 🔄 Keep Capri Store Alive

on:
  schedule:
    # Ejecutar cada 2 horas (ahorra recursos de Neon y Render)
    - cron: '0 */2 * * *'
  
  # Permitir ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 🔄 Keep-Alive Ping (sin consulta a BBDD)
        run: |
          echo "🔄 Ejecutando keep-alive para mantener Render activo..."
          echo "💡 IMPORTANTE: NO consulta base de datos Neon (ahorro de costos)"
          response=$(curl -s -w "HTTPSTATUS:%{http_code}" -H "User-Agent: GitHub-Actions-Keep-Alive" https://capri-store.onrender.com/ping)
          http_code=$(echo $response | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')
          body=$(echo $response | sed -e 's/HTTPSTATUS:.*//g')
          
          echo "📊 Status Code: $http_code"
          
          if [ $http_code -eq 200 ]; then
            echo "✅ Servicio Render: ACTIVO"
            
            # Extraer estado de WhatsApp (sin iniciar reconexión)
            if command -v jq &> /dev/null; then
              whatsapp_ready=$(echo "$body" | jq -r '.whatsapp_ready // false')
              uptime=$(echo "$body" | jq -r '.uptime // 0')
              echo "📱 WhatsApp: $whatsapp_ready"
              echo "⏱️  Uptime: $uptime segundos"
            fi
            
            echo "💾 Base de datos Neon: NO CONSULTADA (ahorro de recursos)"
          else
            echo "❌ Servicio no responde"
            exit 1
          fi

      - name: 🎯 Summary
        run: |
          echo ""
          echo "🎯 ===== RESUMEN DE KEEP-ALIVE ====="
          echo "📅 Fecha: $(date)"
          echo "✅ Servicio Render mantenido activo"
          echo "💾 Base de datos Neon: NO consumida"
          echo "📱 WhatsApp: Se reconecta automáticamente en nuevas ventas"
          echo "⏰ Próxima ejecución: en 2 horas"
          echo "🌐 URL: https://capri-store.onrender.com"
          echo "💡 Para reconexión manual: /whatsapp-regenerar-qr"
          echo "=================================="
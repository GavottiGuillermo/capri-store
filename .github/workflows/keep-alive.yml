name: 🔄 Keep Capri Store Alive

on:
  schedule:
    # GitHub Actions mínimo es cada 5 minutos (el keep-alive interno del servidor se encarga de los 2 min)
    - cron: '*/5 * * * *'
  
  # Permitir ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 🔄 Keep-Alive + Mensaje WhatsApp Admin
        run: |
          echo "🔄 Ejecutando keep-alive cada 5 min para mantener sesión WhatsApp activa..."
          response=$(curl -s -w "HTTPSTATUS:%{http_code}" -H "User-Agent: GitHub-Actions-Keep-Alive" https://capri-store.onrender.com/whatsapp-keep-alive)
          http_code=$(echo $response | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')
          body=$(echo $response | sed -e 's/HTTPSTATUS:.*//g')
          
          echo "📊 Status Code: $http_code"
          
          if [ $http_code -eq 200 ]; then
            echo "✅ Servicio activo"
            
            # Extraer estado de WhatsApp
            if command -v jq &> /dev/null; then
              whatsapp_ready=$(echo "$body" | jq -r '.whatsapp_ready // false')
              mensaje_enviado=$(echo "$body" | jq -r '.mensaje_enviado // false')
              echo "📱 WhatsApp: $whatsapp_ready"
              echo "💬 Mensaje al admin: $mensaje_enviado"
            fi
          else
            echo "❌ Servicio no responde"
            exit 1
          fi

      - name: 🎯 Summary
        run: |
          echo ""
          echo "🎯 ===== RESUMEN DE KEEP-ALIVE ====="
          echo "📅 Fecha: $(date)"
          echo "✅ Servicio Render mantenido activo"
          echo "📱 WhatsApp: Mensaje al admin cada 5 min"
          echo "⏰ Próxima ejecución: en 5 minutos"
          echo "🔄 Verificación automática cada 5 min"
          echo "🌐 URL: https://capri-store.onrender.com"
          echo "💡 Para reconexión manual: /whatsapp-regenerar-qr"
          echo "=================================="
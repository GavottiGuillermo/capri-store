<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Capri Store - Panel Admin</title>
  <link rel="icon" type="image/jpeg" href="assets/img/logo-capri.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    :root {
      --vino-tinto: #6b0a0a;
      --rosado: #e29ca3;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, var(--vino-tinto), var(--rosado));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      max-width: 380px;
      width: 100%;
      border: none;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .logo-capri { height: 56px; width: 56px; border-radius: 50%; object-fit: cover; }
    .btn-vino-tinto { background-color: var(--vino-tinto); color: #fff; border: none; }
    .btn-vino-tinto:hover { background-color: #4a0707; color: #fff; }
    #login-error { display: none; }
  </style>
</head>
<body>
  <div class="card login-card p-4">
    <div class="text-center mb-3">
      <img src="assets/img/logo-capri.jpg" alt="Capri Store" class="logo-capri mb-2"/>
      <h4 class="mb-0">Panel Admin</h4>
      <small class="text-muted">Capri Store</small>
    </div>

    <div id="login-error" class="alert alert-danger py-2"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" class="form-control" id="username" name="username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-vino-tinto btn-block" id="login-submit">Ingresar</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando...';

      try {
        const response = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'No se pudo iniciar sesión');
        }

        window.location.href = 'admin.html';
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>

services:
  - type: web
    name: capri-store-backend
    env: node
    plan: free
    buildCommand: |
      echo "🔧 Instalando dependencias del sistema..."
      apt-get update
      apt-get install -y wget gnupg ca-certificates
      wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
      sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
      apt-get update
      apt-get install -y google-chrome-stable fonts-liberation libnss3 libxss1 libasound2 libatk-bridge2.0-0 libgtk-3-0 libgbm1 --no-install-recommends
      echo "✅ Google Chrome instalado en /usr/bin/google-chrome-stable"
      which google-chrome-stable
      google-chrome-stable --version
      echo "🔧 Instalando dependencias de Node.js..."
      npm install
      echo "✅ Build completado exitosamente"
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false  # ✅ DESACTIVADO - Solo deploy manual para evitar reinicios no deseados
    # FORZAR UNA SOLA INSTANCIA - CRÍTICO
    numInstances: 1
    scaling:
      minInstances: 1
      maxInstances: 1
    # Desactivar optimizaciones que causan múltiples instancias
    startOptimized: false
    # Health check configuración - OPTIMIZADA para estabilidad
    # ⚠️ USAR /ping en lugar de /health para evitar logs excesivos
    healthCheckPath: /ping
    healthCheckTimeout: 30
    healthCheckGracePeriod: 180  # 3 minutos para inicializar
    healthCheckInterval: 300  # ⏰ Cada 5 minutos (suficiente para mantener activo)
    startTimeout: 300  # ✅ Más tiempo para inicializar WhatsApp
    # Deploy sin zero-downtime para evitar instancias simultáneas
    zeroDowntimeDeployment: false
    envVars:
      - key: NODE_ENV
        value: production
      # Variable para identificar despliegue en Render
      - key: RENDER
        value: true
      # Variables para Puppeteer/Chrome en Render
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: true
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/google-chrome-stable
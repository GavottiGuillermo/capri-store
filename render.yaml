services:
  - type: web
    name: capri-store-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    # FORZAR UNA SOLA INSTANCIA - CRÍTICO
    numInstances: 1
    scaling:
      minInstances: 1
      maxInstances: 1
    # Desactivar optimizaciones que causan múltiples instancias
    startOptimized: false
    # Health check configuración - REDUCIDA FRECUENCIA
    healthCheckPath: /health
    healthCheckTimeout: 60
    healthCheckGracePeriod: 300
    healthCheckInterval: 300
    startTimeout: 180
    # Deploy sin zero-downtime para evitar instancias simultáneas
    zeroDowntimeDeployment: false
    envVars:
      - key: NODE_ENV
        value: production
      # Variable para identificar despliegue en Render
      - key: RENDER
        value: true
services:
  - type: web
    name: capri-store-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    # CRÍTICO: Forzar UNA SOLA instancia para evitar conflictos de WhatsApp
    numInstances: 1
    # Estrategia de deploy: reemplazar instancia anterior antes de crear nueva
    # Esto evita que haya 2 instancias corriendo simultáneamente
    preDeployCommand: echo "Preparando deploy - instancia anterior será terminada primero"
    # Health check mejorado para asegurar que WhatsApp esté realmente listo
    healthCheckPath: /health
    healthCheckTimeout: 30
    # Tiempo de gracia para que la nueva instancia esté lista antes de matar la anterior
    startTimeout: 120
    envVars:
      - key: NODE_ENV
        value: production
      # Agregar flag para identificar que estamos en Render
      - key: RENDER
        value: true
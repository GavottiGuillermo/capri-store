services:
  - type: web
    name: capri-store-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    # CRÍTICO: Una sola instancia para WhatsApp - elimina necesidad de Instance Lock
    numInstances: 1
    # Desactivar optimización de inicio para garantizar una sola instancia
    startOptimized: false
    # Health check simplificado
    healthCheckPath: /health
    healthCheckTimeout: 30
    # Tiempo de inicio más conservador para session recovery
    startTimeout: 120
    envVars:
      - key: NODE_ENV
        value: production
      # Variable para identificar despliegue en Render
      - key: RENDER
        value: true